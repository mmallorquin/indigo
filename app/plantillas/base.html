<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indigo · Catálogo</title>
  <style>
    :root { --fondo:#f6f5fb; --tarjeta:#fff; --texto:#1d1b2e; --suave:#6b6880; --acento:#3f3a9e; --borde:#e3e1ee; --error:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --fondo:#14131c; --tarjeta:#1e1c2a; --texto:#ecebf5; --suave:#a5a2bb; --acento:#9d97ff; --borde:#2f2c42; --error:#ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--fondo); color:var(--texto); line-height:1.5; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; }
    header a { color:var(--texto); text-decoration:none; font-weight:700; font-size:1.4rem; letter-spacing:.02em; }
    header span { color:var(--suave); font-size:.9rem; }
    .tarjeta { background:var(--tarjeta); border:1px solid var(--borde); border-radius:14px; padding:18px; margin-bottom:16px; }
    button, .boton { background:var(--acento); color:#fff; border:0; border-radius:10px; padding:12px 18px; font-size:1rem; cursor:pointer; text-decoration:none; display:inline-block; }
    button:disabled { opacity:.6; cursor:wait; }
    input[type=file] { width:100%; margin:12px 0; }
    .error { color:var(--error); }
    .grilla { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
    .grilla a { color:inherit; text-decoration:none; }
    .grilla img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--borde); }
    .chips span { display:inline-block; border:1px solid var(--borde); border-radius:999px; padding:2px 10px; margin:2px 4px 2px 0; font-size:.9rem; }
    .suave { color:var(--suave); font-size:.9rem; }
    dt { font-weight:600; margin-top:12px; }
    dd { margin:2px 0 0; }
    .foto-ficha { width:100%; max-height:420px; object-fit:contain; border-radius:10px; background:var(--borde); }
  </style>
</head>
<body>
<main>
  <header><a href="/">Indigo</a><span>Catálogo</span></header>
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
