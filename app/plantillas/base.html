<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="{{ marca.identidad.colores | selectattr('clave', 'eq', 'olivo') | map(attribute='hex') | first }}">
  <title>{{ marca.nombre }} · {% block titulo %}Catálogo{% endblock %}</title>
  <link rel="icon" href="/static/{{ marca.identidad.logo }}">
  {# Los colores salen de marca.toml: una sola fuente de verdad para la app y para los agentes #}
  <style>:root { {% for c in marca.identidad.colores %}--{{ c.clave }}:{{ c.hex }}; {% endfor %}}</style>
  <link rel="stylesheet" href="/static/indigo.css?v={{ version }}">
</head>
<body>
<header class="cabecera{% block cabecera %}{% endblock %}">
  <div>
    <a class="logo" href="{% block inicio %}/{% endblock %}" aria-label="{{ marca.nombre }}: inicio">
      <img src="/static/{{ marca.identidad.logo }}" alt="" width="44" height="44">
      <span>ÍNDIGO <small>PY</small></span>
    </a>
    {% block nav %}
    <nav>
      <a href="/" {% if request.url.path == '/' or request.url.path.startswith('/ficha') %}aria-current="page"{% endif %}>Catálogo</a>
      <a href="/probador/prendas" {% if request.url.path.startswith('/probador') %}aria-current="page"{% endif %}>Probador</a>
      <a href="/marca" {% if request.url.path == '/marca' %}aria-current="page"{% endif %}>Marca</a>
    </nav>
    {% endblock %}
  </div>
</header>
<main>
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
